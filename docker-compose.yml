# Local/staging stack. For production, put a TLS-terminating reverse proxy in front of `api`,
# set COOKIE_SECURE=true, APP_ORIGIN=https://your-domain and TRUST_PROXY=true, and use managed
# PostgreSQL backups. Copy .env.example to .env and replace every CHANGE_ME value first.
name: cbid-lms

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CBID_OWNER_PASSWORD: ${CBID_OWNER_PASSWORD:?set CBID_OWNER_PASSWORD}
      CBID_APP_PASSWORD: ${CBID_APP_PASSWORD:?set CBID_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/10-cbid.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cbid_lms"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    environment: &appenv
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://cbid_app:${CBID_APP_PASSWORD}@db:5432/cbid_lms
      DATABASE_OWNER_URL: postgres://cbid_owner:${CBID_OWNER_PASSWORD}@db:5432/cbid_lms
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-CBID Institute <no-reply@cbidnetwork.org>}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    environment: *appenv
    ports: ["4000:4000"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *appenv
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
